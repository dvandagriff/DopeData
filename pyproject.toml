[project]
name = "dope"
version = "0.1.0"
description = "Data Observatory - Pipeline observability: Fivetran + dbt lineage, freshness, static viz"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
kuzu = ["kuzu>=0.4.0"]
dev = ["ruff", "mypy", "pytest"]

[project.scripts]
dope = "dope.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
strict_optional = true
