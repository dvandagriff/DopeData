[project]
name = "dopedata"
version = "0.1.0"
description = "Pipeline observability for the modern data stack — Fivetran + dbt lineage, business-day freshness intelligence, and local-first graph queries"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Drew Vandagriff"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
kuzu = ["kuzu>=0.4.0"]
dev = ["ruff", "mypy", "pytest"]

[project.scripts]
dopedata = "dopedata.cli.main:main"

[project.urls]
Homepage = "https://github.com/dvandagriff/DopeData"
Documentation = "https://github.com/dvandagriff/DopeData#readme"
Repository = "https://github.com/dvandagriff/DopeData"
Issues = "https://github.com/dvandagriff/DopeData/issues"
Changelog = "https://github.com/dvandagriff/DopeData/releases"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
strict_optional = true
